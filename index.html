<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<title>教室</title>
<style>
:root{--fg:#17202b;--panel:rgba(255,255,255,.88);--btn:rgba(255,255,255,.55);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fg:#e4e9f0;--panel:rgba(18,24,32,.88);--btn:rgba(18,24,32,.55)}}

html,body{height:100%;margin:0;background:#222;color:var(--fg);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
.box{position:fixed;background:var(--panel);border-radius:8px;padding:8px 12px;font-size:14px}

#held{left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);display:none}
#bar{right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);display:none}

#joy,#btns{display:none;position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);touch-action:none}
#joy{left:24px;width:130px;height:130px;border-radius:50%;background:var(--btn);border:2px solid var(--fg)}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--fg);opacity:.6}
#btns{right:24px}
#btns button{display:block;width:80px;height:80px;border-radius:50%;border:2px solid var(--fg);background:var(--btn);color:var(--fg);font-size:17px;touch-action:none}
.touch #joy,.touch #btns{display:block}
.touch #hint{display:none}
.bmode #joy,.bmode #btns,.bmode #hint,.bmode #held,.bmode #who{display:none!important}
.bmode #bar{display:block}
#cbtn{left:12px;top:calc(env(safe-area-inset-top,0px) + 64px);border:1px solid var(--fg);color:var(--fg);font-family:inherit;cursor:pointer}
#cpanel{left:12px;top:calc(env(safe-area-inset-top,0px) + 108px);display:none;max-width:250px}
#cpanel .row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
#cpanel .ttl{font-size:13px;opacity:.75}
#cpanel button{margin:0}
#cpanel .sh.on{background:var(--fg);color:var(--panel)}

.bmode #cbtn,.bmode #cpanel{display:none!important}
#who{cursor:pointer}
.dcard{width:min(340px,100%);box-sizing:border-box;background:var(--panel);color:var(--fg);border-radius:14px;padding:20px 18px;box-shadow:0 8px 30px rgba(0,0,0,.35);font-size:15px}
.dcard h2{margin:0 0 6px;font-size:20px}
.dcard p{margin:0 0 14px;line-height:1.5;opacity:.8}
.dcard .acts{display:flex;gap:8px;flex-wrap:wrap}
#nickdlg,#res{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,14,18,.6);padding:16px;box-sizing:border-box}
#nickdlg{z-index:60}
#res{z-index:40}
#nickdlg input{width:100%;box-sizing:border-box;font:inherit;font-size:18px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--fg);background:transparent;color:var(--fg);user-select:text;-webkit-user-select:text}
#nickerr{min-height:20px;margin:8px 0 10px;font-size:14px;color:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #nickerr{color:#ff8f78}}
:root[data-theme="dark"] #nickerr{color:#ff8f78}
.pbtn{min-height:44px;padding:0 16px;border-radius:10px;border:1.5px solid var(--fg);background:transparent;color:var(--fg);font:inherit;font-size:16px;cursor:pointer;touch-action:manipulation}
.pbtn.main{background:var(--fg);color:var(--panel)}
.pbtn:disabled{opacity:.35;cursor:default}
#tbl{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 100px);transform:translateX(-50%);display:none;min-width:220px;max-width:calc(100vw - 24px);box-sizing:border-box;text-align:center;background:var(--panel);border-radius:12px;padding:10px 14px;font-size:14px}
#tbl .ttl{font-size:13px;opacity:.75;margin-bottom:6px}
#tbl .hint{font-size:13px;opacity:.75;margin:0 0 10px}
.sl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 8px}
.chip{padding:4px 10px;border-radius:999px;border:1.5px solid var(--fg);font-size:14px;white-space:nowrap}
.chip.me{font-weight:700}
.chip.rd{background:var(--fg);color:var(--panel)}
.chip.em{opacity:.45;border-style:dashed}
.chip.turn{outline:3px solid #f2c230;outline-offset:1px}
.chip.out{opacity:.45;text-decoration:line-through}
#tbl .acts,#gp .act{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#gp{position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;box-sizing:border-box;padding:10px 8px calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--panel);border-radius:16px 16px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.25);font-size:14px}
#gp .top{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
#gp .mid{min-height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;margin:6px 0}
#gp .cap.my{font-weight:700;font-size:16px}
.row5{display:flex;padding-left:6px}
.cd{flex:none;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:6px;border:1px solid #8a9096;background:#fff;color:#1a1a1a;font-family:inherit;font-weight:700;padding:0;line-height:1.1;touch-action:manipulation}
.cd.red{color:#c62828}
.row5 .cd{margin-left:-6px}
#gp .hand{display:flex;justify-content:center;padding-top:16px}

#gp button.cd.sel{transform:translateY(-14px);box-shadow:0 0 0 3px #f2c230}

#res .row.win{font-weight:700}
#res .acts{margin-top:14px}
.gmode #joy,.gmode #btns,.gmode #hint,.gmode #cbtn,.gmode #cpanel,.gmode #held{display:none!important}
#wbox{left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);display:none;gap:8px;padding:6px;z-index:15}
#wbox.on{display:flex}
#wbox button{min-height:44px;margin:0;padding:0 14px;font-size:15px}
.touch #wbox{bottom:calc(env(safe-area-inset-bottom,0px) + 180px)}
#btns #bj{margin-bottom:12px}
.bmode #wbox,.gmode #wbox{display:none!important}
@media (max-width:480px){.pbtn{padding:0 10px;font-size:15px}#gp .mid{min-height:76px}}
#here{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:80;display:none;min-width:96px;min-height:64px;padding:0 20px;border-radius:14px;border:3px solid var(--fg);background:var(--panel);color:var(--fg);font:inherit;font-size:32px;font-weight:700;touch-action:manipulation;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#here.wait{opacity:.8;font-size:16px;font-weight:600;min-height:52px;cursor:default}
#here.go{background:#f2c230;color:#17202b;border-color:#17202b;animation:hereblink .4s infinite alternate}
@keyframes hereblink{from{transform:scale(1)}to{transform:scale(1.12)}}
.rollon #held{top:calc(env(safe-area-inset-top,0px) + 80px)}
.rollon #cbtn{top:calc(env(safe-area-inset-top,0px) + 132px)}
.rollon #cpanel{top:calc(env(safe-area-inset-top,0px) + 176px)}
#cls{right:12px;top:calc(env(safe-area-inset-top,0px) + 104px);display:none;font-size:13px;padding:5px 10px;pointer-events:none;white-space:nowrap}
.bmode #cls{display:none!important}
#att{left:50%;top:calc(env(safe-area-inset-top,0px) + 104px);transform:translateX(-50%);display:none;z-index:30;text-align:center;white-space:pre-line;max-width:calc(100vw - 24px);box-sizing:border-box;line-height:1.6;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="held" class="box">手持：板擦<button id="drop">放下</button></div>
<div id="bar" class="box"><span id="toolname">粉筆</span><button id="swap">改用粉筆</button><button id="exit">離開黑板</button></div>
<div id="toast" class="box"></div>
<button id="here" type="button">到</button>
<div id="cls" class="box"></div>
<div id="att" class="box"></div>
<div id="who" class="box" title="點一下可以改暱稱" style="right:12px;top:calc(env(safe-area-inset-top,0px) + 12px)"></div>
<button id="cbtn" class="box">造型</button>
<div id="cpanel" class="box"><div class="ttl">形狀</div><div class="row" id="shrow"></div><div class="ttl">顏色</div><div class="row" id="cwrow"></div></div>
<div id="hint" class="box">W A S D　移動　拖曳或方向鍵　轉動視角<br>E　互動　也可以直接點擊椅子、門、窗戶、黑板、板擦、時鐘、毯子（大老二）<br>空白鍵　跳躍　R　回到教室起點<br>點名時，叫到你的名字就按左上角「到」（或空白鍵）</div>
<div id="joy"><div id="knob"></div></div>
<div id="btns"><button id="bj">跳</button><button id="bi">互動</button></div>
<div id="wbox" class="box"><button id="wtog" class="pbtn" type="button">開窗</button><button id="wgo" class="pbtn main" type="button">翻出窗外</button></div>
<div id="nickdlg"><div class="dcard"><h2>你的暱稱</h2><p>最多 7 個字，不能和線上的人重複。</p><input id="nickin" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-label="暱稱"><div id="nickerr" role="alert"></div><div class="acts"><button id="nickok" class="pbtn main">進入教室</button><button id="nickcancel" class="pbtn" style="display:none">取消</button></div></div></div>
<div id="tbl"></div>
<div id="gp"></div>
<div id="res"><div class="dcard" id="resc"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// 自己的連線層：用 WebSocket 取代 claude.ai 的 room 和 db
(function(){
var ws=null,myId=null,connected=false,myPresence={},peerMap={},cache=null,handlers=[],boardCbs=[],lastBoards=[],nick=null,tryNick=null,nickFn=null,btFn=null,lastBt=null,winFn=null,lastWin=null,tinfoFn=null,lastTinfo=null,tchFn=null,lastTch=null,qFn=null,qsFn=null,lastQs=null,rollFn=null,bellFn=null;
function rebuild(){
  var a=[];
  Object.keys(peerMap).forEach(function(k){a.push({peer:k,isMe:false,sameTab:false,kind:'viewer',guest:false,by:null,presence:peerMap[k]});});
  a.push({peer:myId||'me',isMe:true,sameTab:true,kind:'viewer',guest:false,by:null,presence:myPresence});
  cache=a;
}
function send(o){
  var s=JSON.stringify(o);
  if(ws&&ws.readyState===1)ws.send(s);
}
function snap(doc,r){return {exists:!!doc,r:r,data:function(){return doc;}};}
function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
  ws.onopen=function(){connected=true;var n=tryNick||nick;if(n)send({t:'nick',n:n});send({t:'presence',p:myPresence});};
  ws.onmessage=function(e){
    var m;try{m=JSON.parse(e.data);}catch(x){return;}
    if(m.t==='hello'){
      myId=m.id;peerMap={};
      m.peers.forEach(function(q){peerMap[q.peer]=q.presence;});
      (m.boards||[]).forEach(function(b,i){if(b){lastBoards[i]=b;boardCbs.forEach(function(f){f(snap(b,i));});}});
    }else if(m.t==='presence'){peerMap[m.peer]=m.presence;
    }else if(m.t==='leave'){delete peerMap[m.peer];
    }else if(m.t==='emit'){
      handlers.forEach(function(h){if(h.topic===m.topic)h.fn({topic:m.topic,data:m.data,peer:m.peer,isMe:false,sameTab:false,kind:'viewer'});});
    }else if(m.t==='board'){var br=(m.r===1||m.r===2)?m.r:0;lastBoards[br]=m.doc;boardCbs.forEach(function(f){f(snap(m.doc,br));});
    }else if(m.t==='nick'){nick=m.ok?m.n:(m.n||null);tryNick=null;if(nickFn)nickFn(m);
    }else if(m.t==='bt'){lastBt=m;if(btFn)btFn(m);
    }else if(m.t==='win'){lastWin=m.w;if(winFn)winFn(m.w);
    }else if(m.t==='tinfo'){lastTinfo=m;if(tinfoFn)tinfoFn(m);
    }else if(m.t==='tch'){lastTch=m;if(tchFn)tchFn(m);
    }else if(m.t==='q'){if(qFn)qFn(m.q);
    }else if(m.t==='qs'){lastQs=m.qs;if(qsFn)qsFn(m.qs);
    }else if(m.t==='roll'){if(rollFn)rollFn(m);
    }else if(m.t==='bell'){if(bellFn)bellFn(m);}
    rebuild();
  };
  ws.onclose=function(){connected=false;peerMap={};rebuild();setTimeout(connect,2000);};
  ws.onerror=function(){};
}
rebuild();
var room={
  peers:function(){return cache;},
  presence:function(p){for(var k in p)myPresence[k]=p[k];rebuild();send({t:'presence',p:myPresence});return Promise.resolve();},
  emit:function(topic,data){send({t:'emit',topic:topic,data:data});return Promise.resolve();},
  on:function(topic,fn){handlers.push({topic:topic,fn:fn});return function(){};}
};
var db={doc:function(){return {
  onSnapshot:function(cb){boardCbs.push(cb);lastBoards.forEach(function(b,i){if(b)cb(snap(b,i));});return function(){};},
  set:function(d){send({t:'setboard',doc:d});return Promise.resolve();}
};}};
window.claude={use:function(name){return Promise.resolve(name==='room'?room:name==='db'?db:null);}};
// 暱稱與大老二：由伺服器驗證，這裡只負責收發
window.net={
  setNick:function(n){tryNick=n;if(connected)send({t:'nick',n:n});},
  onNick:function(f){nickFn=f;},
  onBt:function(f){btFn=f;if(lastBt)f(lastBt);},
  bt:function(o){o.t='bt';send(o);},
  onWin:function(f){winFn=f;if(lastWin)f(lastWin);},
  win:function(i,o){send({t:'win',i:i,o:o?1:0});},
  online:function(){return connected;},
  onTinfo:function(f){tinfoFn=f;if(lastTinfo)f(lastTinfo);},
  onTch:function(f){tchFn=f;if(lastTch)f(lastTch);},
  onQ:function(f){qFn=f;},
  onQs:function(f){qsFn=f;if(lastQs)f(lastQs);},
  onRoll:function(f){rollFn=f;},
  onBell:function(f){bellFn=f;},
  here:function(){send({t:'here'});}
};
connect();
})();
</script>

  var q=pl(3,62,-9.5,H,10,0,0xdadde0);q.rotation.x=Math.PI/2;})();
[-3.5,3.5].forEach(function(x){[-3,0.5,4].forEach(function(z){var l=pl(0.5,2.6,x,H-0.01,z,0,0xffffff,true);l.rotation.x=Math.PI/2;});});

// stage, teacher desk, cabinet, bulletin board
box(16,0.25,2.2,0x8d6e63,0,0.125,-5.9);
box(2.2,0.9,0.9,0xa87c52,4.5,0.7,-5.9);solid(3.4,5.6,-6.35,-5.45);

var kc=document.createElement('canvas');kc.width=kc.height=256;var kx=kc.getContext('2d'),ktex=new THREE.CanvasTexture(kc),lastSec=-1;

// blackboards: one per classroom (0,1,2), content saved separately on the server

function winFree(){return mode==='walk'&&!seat&&bseat<0&&!vault;}
function toggleWin(w){
  if(!winFree())return;
  if(Math.hypot(p.x-w.x,p.z-w.z)>3.2){say('走近窗戶再操作');return;}
  w.open=!w.open;say(w.open?'窗戶打開了':'窗戶關上了');net.win(wins.indexOf(w),w.open);

function actWin(w){
  if(!winFree())return;
  if(!w.open){toggleWin(w);return;}
  if(Math.hypot(p.x-w.x,p.z-w.z)>3.2){say('走近窗戶再操作');return;}
  var ie=(p.x-w.x)*w.s>0;vault={t:0,x0:p.x,z0:p.z,x1:ie?w.x-w.s*1.0:w.x+w.s*1.6,z1:w.z,out:!ie};
}

  nw=best;var on=!!best;if(wbox.classList.contains('on')!==on)wbox.classList.toggle('on',on);

function actChair(c){
  if(bseat>=0){say('先離開牌桌');return;}
  if(seat){say('先站起來才能換位子');return;}
  if(dxz(c.x,c.z)>2.6){say('走近椅子再點');return;}

  if(room&&room.peers().some(function(q){return !q.isMe&&q.presence&&q.presence.s===ci;})){say('這個位子有人坐了');return;}
  sit(c);say('坐下了，按 E 或「站起來」離開座位');
}

function classify(ids){
  var n=ids.length;if(!n)return null;
  var c=ids.slice().sort(function(a,b){return a-b;}),i;
  if(n===1)return {k:'single',n:1,g:0,p:c[0]};
  if(n===2)return crk(c[0])===crk(c[1])?{k:'pair',n:2,g:0,p:c[1]}:null;
  if(n!==5)return null;
  var cnt={};for(i=0;i<5;i++)cnt[crk(c[i])]=(cnt[crk(c[i])]||0)+1;
  var ranks=Object.keys(cnt).map(Number),flush=true;
  for(i=1;i<5;i++)if(csu(c[i])!==csu(c[0]))flush=false;
  if(ranks.length===5){
    for(var s0=0;s0<13;s0++){
      var run=true;for(i=0;i<5;i++)if(!cnt[(s0+i)%13]){run=false;break;}
      if(run){var t=(s0+4)%13,tc=c.filter(function(x){return crk(x)===t;})[0];return {k:flush?'sflush':'straight',n:5,g:flush?5:1,p:tc};}
    }
    return flush?{k:'flush',n:5,g:2,p:c[4]}:null;
  }
  if(ranks.length===2){
    var a=ranks[0],b=ranks[1];
    if(cnt[a]===4)return {k:'four',n:5,g:4,p:a};
    if(cnt[b]===4)return {k:'four',n:5,g:4,p:b};
    return {k:'full',n:5,g:3,p:cnt[a]===3?a:b};
  }
  return null;
}

      }
      var feet=p.y-0.5,gy=groundAt(p.x,p.z);
      if((keys.Space||jumpReq)&&!air){vy=6.2;air=true;}
      jumpReq=false;
      if(!air&&feet>gy+0.08){air=true;vy=0;}
      if(air){vy-=18*dt;feet+=vy*dt;if(vy<=0&&feet<=gy){feet=gy;air=false;vy=0;}}
      else feet+=(gy-feet)*Math.min(1,14*dt);
      p.y=feet+0.5;
      if(feet<-4){say('掉出地圖了，回到教室');reset();}
    }
    camera.up.set(0,1,0);
    var cx=p.x+Math.sin(yaw)*Math.cos(pitch)*dist,cy=p.y+Math.sin(pitch)*dist,cz=p.z+Math.cos(yaw)*Math.cos(pitch)*dist;
    var rm=roomOf(p.x,p.z);
    if(rm)camera.position.set(clamp(cx,rm[0]+.3,rm[1]-.3),clamp(cy,0.4,H-0.3),clamp(cz,rm[2]+.3,rm[3]-.3));
    else camera.position.set(clamp(cx,-70,70),clamp(cy,0.4,14),clamp(cz,-70,70));
    camera.lookAt(p.x,p.y,p.z);
  }else{
    var portrait=camera.aspect<1,d=portrait?7.4:Math.min(9,Math.max(2.4,8.5/(camera.aspect*1.1547)));
    camera.up.set(portrait?-1:0,portrait?0:1,0);
    bcam.set(0,BY,BZ+d);camera.position.lerp(bcam,Math.min(1,10*dt));camera.lookAt(bt);
  }
  sun.position.set(p.x+4,10,p.z+5);sun.target.position.set(p.x,0,p.z);sun.target.updateMatrixWorld();
  syncPeers(dt);
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
tick();
})();
</script>
