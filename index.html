<script>
// 自己的連線層：用 WebSocket 取代 claude.ai 的 room 和 db
(function(){
var ws=null,myId=null,connected=false,myPresence={},peerMap={},cache=null,handlers=[],boardCbs=[],lastBoard=null,nick=null,tryNick=null,nickFn=null,btFn=null,lastBt=null;
function rebuild(){
  var a=[];
  Object.keys(peerMap).forEach(function(k){a.push({peer:k,isMe:false,sameTab:false,kind:'viewer',guest:false,by:null,presence:peerMap[k]});});
  a.push({peer:myId||'me',isMe:true,sameTab:true,kind:'viewer',guest:false,by:null,presence:myPresence});
  cache=a;
}
function send(o){
  var s=JSON.stringify(o);
  if(ws&&ws.readyState===1)ws.send(s);
}
function snap(doc){return {exists:!!doc,data:function(){return doc;}};}
function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
  ws.onopen=function(){connected=true;var n=tryNick||nick;if(n)send({t:'nick',n:n});send({t:'presence',p:myPresence});};
  ws.onmessage=function(e){
    var m;try{m=JSON.parse(e.data);}catch(x){return;}
    if(m.t==='hello'){
      myId=m.id;peerMap={};
      m.peers.forEach(function(q){peerMap[q.peer]=q.presence;});
      if(m.board){lastBoard=m.board;boardCbs.forEach(function(f){f(snap(m.board));});}
    }else if(m.t==='presence'){peerMap[m.peer]=m.presence;
    }else if(m.t==='leave'){delete peerMap[m.peer];
    }else if(m.t==='emit'){
      handlers.forEach(function(h){if(h.topic===m.topic)h.fn({topic:m.topic,data:m.data,peer:m.peer,isMe:false,sameTab:false,kind:'viewer'});});
    }else if(m.t==='board'){lastBoard=m.doc;boardCbs.forEach(function(f){f(snap(m.doc));});
    }else if(m.t==='nick'){nick=m.ok?m.n:(m.n||null);tryNick=null;if(nickFn)nickFn(m);
    }else if(m.t==='bt'){lastBt=m;if(btFn)btFn(m);}
    rebuild();
  };
  ws.onclose=function(){connected=false;peerMap={};rebuild();setTimeout(connect,2000);};
  ws.onerror=function(){};
}
rebuild();
var room={
  peers:function(){return cache;},
  presence:function(p){for(var k in p)myPresence[k]=p[k];rebuild();send({t:'presence',p:myPresence});return Promise.resolve();},
  emit:function(topic,data){send({t:'emit',topic:topic,data:data});return Promise.resolve();},
  on:function(topic,fn){handlers.push({topic:topic,fn:fn});return function(){};}
};
var db={doc:function(){return {
  onSnapshot:function(cb){boardCbs.push(cb);if(lastBoard)cb(snap(lastBoard));return function(){};},
  set:function(d){send({t:'setboard',doc:d});return Promise.resolve();}
};}};
window.claude={use:function(name){return Promise.resolve(name==='room'?room:name==='db'?db:null);}};
// 暱稱與大老二：由伺服器驗證，這裡只負責收發
window.net={
  setNick:function(n){tryNick=n;if(connected)send({t:'nick',n:n});},
  onNick:function(f){nickFn=f;},
  onBt:function(f){btFn=f;if(lastBt)f(lastBt);},
  bt:function(o){o.t='bt';send(o);},
  online:function(){return connected;}
};
connect();
})();
</script>

// 和伺服器同一套判斷，只用來決定「出牌」按鈕能不能按
function classify(ids){
  var n=ids.length;if(!n)return null;
  var c=ids.slice().sort(function(a,b){return a-b;}),i;
  if(n===1)return {k:'single',n:1,g:0,p:c[0]};
  if(n===2)return crk(c[0])===crk(c[1])?{k:'pair',n:2,g:0,p:c[1]}:null;
  if(n!==5)return null;
  var cnt={};for(i=0;i<5;i++)cnt[crk(c[i])]=(cnt[crk(c[i])]||0)+1;
  var ranks=Object.keys(cnt).map(Number),flush=true;
  for(i=1;i<5;i++)if(csu(c[i])!==csu(c[0]))flush=false;
  if(ranks.length===5){
    for(var s0=0;s0<13;s0++){
      var run=true;for(i=0;i<5;i++)if(!cnt[(s0+i)%13]){run=false;break;}
      if(run){var t=(s0+4)%13,tc=c.filter(function(x){return crk(x)===t;})[0];return {k:flush?'sflush':'straight',n:5,g:flush?5:1,p:tc};}
    }
    return flush?{k:'flush',n:5,g:2,p:c[4]}:null;
  }
  if(ranks.length===2){
    var a=ranks[0],b=ranks[1];
    if(cnt[a]===4)return {k:'four',n:5,g:4,p:a};
    if(cnt[b]===4)return {k:'four',n:5,g:4,p:b};
    return {k:'full',n:5,g:3,p:cnt[a]===3?a:b};
  }
  return null;
}
function beats(a,b){
  if(!b)return true;
  if(a.n!==b.n)return false;
  if(a.n===5)return a.g!==b.g?a.g>b.g:a.p>b.p;
  return a.p>b.p;
}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function mkCard(id,tag,w,h,fs){
  var e=el(tag,'cd'+(((id&3)===1||(id&3)===2)?' red':''));
  e.style.width=w+'px';e.style.height=h+'px';e.style.fontSize=fs+'px';
  if(tag==='button')e.type='button';
  e.appendChild(el('span','',RN[id>>2]));e.appendChild(el('span','',SU[id&3]));
  e.setAttribute('aria-label',SU[id&3]+RN[id>>2]);
  return e;
}
// 毯子上方的小牌子
var lblTxt='大老二 0/4',lblSp=new THREE.Sprite(new THREE.SpriteMaterial({map:labelTex(lblTxt),depthTest:false}));
lblSp.scale.set(1.8,0.45,1);lblSp.position.set(BC.x,1.45,BC.z);lblSp.renderOrder=5;scene.add(lblSp);
function setLbl(t){if(t===lblTxt)return;lblTxt=t;if(lblSp.material.map)lblSp.material.map.dispose();lblSp.material.map=labelTex(t);lblSp.material.needsUpdate=true;}

function sitB(i){
  var q=BSEAT[i];bseat=i;seat=null;
  player.scale.setScalar(0.6);p.set(q.x,0.33,q.z);facing=q.f;player.rotation.y=facing;yaw=facing+Math.PI;pitch=0.55;
  bi.textContent='離開牌桌';
}
function standB(){
  bseat=-1;player.scale.setScalar(1);p.set(2.0,0.5,5.8);facing=-Math.PI/2;player.rotation.y=facing;yaw=0;
  bi.textContent='互動';
}
function actBlanket(){
  if(bseat>=0){leaveTable();return;}
  if(!nickOK){say('先設定暱稱');return;}
  if(seat){say('先站起來才能加入牌桌');return;}
  if(held){say('先把板擦放下');return;}
  if(Math.hypot(p.x-BC.x,p.z-BC.z)>3.4){say('走近毯子再點');return;}
  net.bt({a:'join'});
}
function leaveTable(){
  var now=performance.now();if(now-warnAt<700)return;warnAt=now;
  if(TB&&TB.ph==='playing'){say('牌局進行中，要離開請按「認輸離開」');return;}
  net.bt({a:'leave'});
}

function onBt(s){
  if(s.err){say(s.err);return;}
  var prev=TB;TB=s;
  myHand=s.hand||[];
  var ns={};myHand.forEach(function(id){if(sel[id])ns[id]=1;});sel=ns;
  dl=performance.now()+(s.tl||0);
  if(s.me>=0&&s.me!==bseat)sitB(s.me);
  else if(s.me<0&&bseat>=0)standB();
  if(s.ph==='playing'&&s.me>=0)joinedGame=true;
  if(s.ph==='ended'&&joinedGame){joinedGame=false;lastRes=s.res;lastResMe=s.me;resOpen=true;}
  if(s.m&&(s.me>=0||joinedGame))say(s.m);
  if(s.ph==='playing'&&s.me>=0&&s.turn===s.me&&(!prev||prev.turn!==s.turn||prev.ph!=='playing')){try{if(navigator.vibrate)navigator.vibrate(60);}catch(e){}}
  renderTable();
}
function renderTable(){
  var s=TB;if(!s)return;
  var n=s.seats.filter(function(x){return x.n;}).length;
  setLbl(s.ph==='lobby'?'大老二 '+n+'/4':'大老二 牌局中');
  var inGame=s.ph==='playing'&&s.me>=0;
  document.body.classList.toggle('gmode',inGame);
  renderLobby(s,n);renderGame(s,inGame);renderRes();
}
function renderLobby(s,n){
  var show=s.me>=0&&s.ph==='lobby';
  tbl.style.display=show?'block':'none';
  if(!show)return;
  tbl.textContent='';
  tbl.appendChild(el('div','ttl','大老二　'+n+'/4'));
  var sl=el('div','sl');
  s.seats.forEach(function(x,i){sl.appendChild(el('div','chip'+(i===s.me?' me':'')+(x.n?(x.r?' rd':''):' em'),x.n?(x.r?'✓ ':'')+x.n:'空位'));});
  tbl.appendChild(sl);
  tbl.appendChild(el('p','hint',n<4?'滿 4 人後可以按「準備」':'4 個人都按準備，就會自動發牌'));
  var ac=el('div','acts'),rb=el('button','pbtn main',s.seats[s.me].r?'取消準備':'準備'),lb=el('button','pbtn','離開');
  rb.type=lb.type='button';rb.disabled=n<4;
  rb.addEventListener('click',function(){net.bt({a:'ready'});});
  lb.addEventListener('click',function(){net.bt({a:'leave'});});
  ac.appendChild(rb);ac.appendChild(lb);tbl.appendChild(ac);
}
function renderGame(s,inGame){
  tmEl=null;btn={};
  if(!inGame){gpan.style.display='none';return;}
  gpan.style.display='block';gpan.textContent='';
  var myTurn=s.turn===s.me;
  var top=el('div','top');
  s.seats.forEach(function(x,i){
    var c=el('div','chip'+(i===s.me?' me':'')+(i===s.turn?' turn':'')+(x.o?' out':''),(x.n||'')+(i===s.me?'（你）':'')+'　'+x.c+' 張');
    if(i===s.turn&&!x.o){c.appendChild(document.createTextNode('　'));tmEl=el('b','','');c.appendChild(tmEl);}
    top.appendChild(c);
  });
  gpan.appendChild(top);
  var mid=el('div','mid');
  if(s.last){
    mid.appendChild(el('div','cap',s.seats[s.last.s].n+' 出了'+KN[s.last.k]));
    var r5=el('div','row5');s.last.c.forEach(function(id){r5.appendChild(mkCard(id,'div',34,48,13));});mid.appendChild(r5);
  }
  var turnName=s.seats[s.turn]?s.seats[s.turn].n:'';
  var status=myTurn?(s.last?'輪到你了':'輪到你領出'+(s.first?'（要包含梅花 3）':'')):('等 '+turnName+(s.last?' 出牌':' 領出'));
  mid.appendChild(el('div','cap'+(myTurn?' my':''),status));
  gpan.appendChild(mid);
  var hand=el('div','hand'),n=myHand.length,cw=window.innerWidth>=700?52:40,ch=Math.round(cw*1.45),fs=cw>=52?18:15;
  var avail=Math.max(200,gpan.clientWidth-16),step=n>1?Math.min(cw+6,(avail-cw)/(n-1)):0;
  myHand.forEach(function(id,i){
    var e=mkCard(id,'button',cw,ch,fs);
    if(i>0)e.style.marginLeft=(step-cw)+'px';
    if(sel[id])e.classList.add('sel');
    e.addEventListener('click',function(){if(sel[id]){delete sel[id];e.classList.remove('sel');}else{sel[id]=1;e.classList.add('sel');}updBtns();});
    hand.appendChild(e);
  });
  gpan.appendChild(hand);
  var ac=el('div','act');
  btn.pass=el('button','pbtn','Pass');btn.play=el('button','pbtn main','出牌');
  var clr=el('button','pbtn','清除');btn.quit=el('button','pbtn','認輸離開');
  [btn.pass,btn.play,clr,btn.quit].forEach(function(b){b.type='button';ac.appendChild(b);});
  btn.pass.addEventListener('click',function(){net.bt({a:'pass'});});
  btn.play.addEventListener('click',function(){net.bt({a:'play',c:selIds()});});
  clr.addEventListener('click',function(){sel={};renderTable();});
  btn.quit.addEventListener('click',function(){
    var now=performance.now();
    if(now-quitAt<3000){quitAt=0;net.bt({a:'leave'});}else{quitAt=now;updTimer();}
  });
  gpan.appendChild(ac);
  updBtns();updTimer();
}
function selIds(){return Object.keys(sel).map(Number).sort(function(a,b){return a-b;});}
function updBtns(){
  var s=TB;if(!btn.play||!s)return;
  var ids=selIds(),combo=ids.length?classify(ids):null,myTurn=s.turn===s.me;
  var lastC=s.last?classify(s.last.c):null;
  var ok=myTurn&&!!combo&&(s.last?beats(combo,lastC):true)&&(!s.first||ids.indexOf(0)>=0);
  btn.play.disabled=!ok;
  btn.play.textContent=combo&&ids.length?'出牌（'+KN[combo.k]+'）':'出牌';
  btn.pass.disabled=!(myTurn&&s.last);
}
function renderRes(){
  if(!(resOpen&&lastRes)){resB.style.display='none';return;}
  resB.style.display='flex';resC.textContent='';
  var r=lastRes;
  resC.appendChild(el('h2','',r.w===lastResMe?'你贏了！':(r.n[r.w]||'')+' 獲勝'));
  resC.appendChild(el('p','','每個人剩下的牌：'));
  r.n.forEach(function(nm,i){
    if(!nm)return;
    var row=el('div','row'+(i===r.w?' win':''));
    row.appendChild(el('span','',nm+(i===lastResMe?'（你）':'')+(r.o[i]?'（已離開）':'')));
    row.appendChild(el('span','',r.c[i]+' 張'));
    resC.appendChild(row);
  });
  var ac=el('div','acts'),ok=el('button','pbtn main','確定');ok.type='button';
  ok.addEventListener('click',function(){resOpen=false;renderTable();});
  ac.appendChild(ok);resC.appendChild(ac);
}
function updTimer(){
  if(tmEl){var t=Math.max(0,Math.ceil((dl-performance.now())/1000))+' 秒';if(tmEl.textContent!==t)tmEl.textContent=t;}
  if(btn.quit){var t2=(performance.now()-quitAt<3000)?'再按一次確認認輸':'認輸離開';if(btn.quit.textContent!==t2)btn.quit.textContent=t2;}
}
setInterval(updTimer,250);
window.addEventListener('resize',function(){if(TB)renderTable();});
net.onBt(onBt);

// blackboard sync: strokes travel live through the room, a snapshot in db serves late joiners
var sid=Math.random().toString(36).slice(2,8),segs=[],flushT=0,snapT=0,lastAct=-1e9,saving=false,dirty=false,warned=false,boardRef=null;
function drawLocal(a,b){
  strokeTo(a,b);lastAct=performance.now();dirty=true;
  segs.push([tool==='chalk'?0:1,Math.round(a.x),Math.round(a.y),Math.round(b.x),Math.round(b.y)]);
  if(!flushT)flushT=setTimeout(flushSegs,100);
  clearTimeout(snapT);snapT=setTimeout(saveBoard,2000);
}
function onSendErr(e){if(e&&e.code==='not_permitted'&&!warned){warned=true;say('你目前只有觀看權限，寫的字別人看不到');}}
function flushSegs(){
  flushT=0;var out=segs;segs=[];
  if(!room)return;
  for(var i=0;i<out.length;i+=100)room.emit('board',{s:out.slice(i,i+100)}).catch(onSendErr);
}
function cl(v,m){return Math.max(0,Math.min(m,v));}
function hookBoard(r){
  r.on('board',function(m){
    if(m.isMe&&m.sameTab)return;
    var d=m.data;if(!d||!Array.isArray(d.s))return;
    d.s.slice(0,100).forEach(function(g){
      if(!Array.isArray(g)||g.length!==5)return;
      var n=g.map(Number);if(!n.every(isFinite))return;
      strokeTo({x:cl(n[1],BW),y:cl(n[2],BHc)},{x:cl(n[3],BW),y:cl(n[4],BHc)},n[0]?'eraser':'chalk');
    });
    lastAct=performance.now();
  },function(){});
}
function saveBoard(){
  snapT=0;
  if(!boardRef||!dirty)return;
  if(saving){snapT=setTimeout(saveBoard,1000);return;}
  var url=bc.toDataURL('image/jpeg',0.75);
  if(url.length>230000){var t=document.createElement('canvas');t.width=800;t.height=220;t.getContext('2d').drawImage(bc,0,0,800,220);url=t.toDataURL('image/jpeg',0.7);}
  if(url.length>230000)return;
  saving=true;dirty=false;
  boardRef.set({img:url,by:sid,at:Date.now()}).catch(function(){}).then(function(){saving=false;});
}
function applySnap(snap){
  if(!snap.exists)return;
  var d=snap.data();
  if(!d||typeof d.img!=='string'||d.img.indexOf('data:image/jpeg;base64,')!==0||d.by===sid)return;
  if(performance.now()-lastAct<3000)return;
  var im=new Image();im.onload=function(){bx.drawImage(im,0,0,BW,BHc);btex.needsUpdate=true;};im.src=d.img;
}
try{if(window.claude&&window.claude.use)window.claude.use('db').then(function(d){if(!d)return;boardRef=d.doc('classroom/board');boardRef.onSnapshot(applySnap,function(){});}).catch(function(){});}catch(e){}
var clk=new THREE.Clock(),bcam=new THREE.Vector3(),bt=new THREE.Vector3(0,BY,BZ+0.07);
function tick(){
  var dt=Math.min(clk.getDelta(),0.05),now=new Date();
  if(now.getSeconds()!==lastSec){lastSec=now.getSeconds();drawClock(now);}
  doors.forEach(function(d){d.piv.rotation.y+=((d.open?-Math.PI/2:0)-d.piv.rotation.y)*Math.min(1,6*dt);});
  if(mode==='walk'){
    if(keys.ArrowLeft)yaw+=1.8*dt;if(keys.ArrowRight)yaw-=1.8*dt;
    if(keys.ArrowUp)pitch=Math.min(1.4,pitch+1.2*dt);if(keys.ArrowDown)pitch=Math.max(0.05,pitch-1.2*dt);
    var f=(keys.KeyW?1:0)-(keys.KeyS?1:0)-joy.y,r=(keys.KeyD?1:0)-(keys.KeyA?1:0)+joy.x,m=Math.hypot(f,r);
    if(m>1){f/=m;r/=m;m=1;}
    if(seat||bseat>=0){if(m>0.5){if(seat)stand();else leaveTable();}}
    else{
      if(m>0.08){
        var dx=-Math.sin(yaw)*f+Math.cos(yaw)*r,dz=-Math.cos(yaw)*f-Math.sin(yaw)*r;
        tryMove(p.x+dx*4.5*dt,p.z+dz*4.5*dt);
        var tg=Math.atan2(dx,dz),df=Math.atan2(Math.sin(tg-facing),Math.cos(tg-facing));
        facing+=df*Math.min(1,12*dt);player.rotation.y=facing;
      }
      var feet=p.y-0.5;feet+=(groundAt(p.x,p.z)-feet)*Math.min(1,14*dt);p.y=feet+0.5;
    }
    camera.up.set(0,1,0);
    var cx=p.x+Math.sin(yaw)*Math.cos(pitch)*dist,cy=p.y+Math.sin(pitch)*dist,cz=p.z+Math.cos(yaw)*Math.cos(pitch)*dist;
    camera.position.set(clamp(cx,-7.7,7.7),clamp(cy,0.4,H-0.3),clamp(cz,-6.8,6.8));
    camera.lookAt(p.x,p.y,p.z);
  }else{
    var portrait=camera.aspect<1,d=portrait?7.4:Math.min(9,Math.max(2.4,8.5/(camera.aspect*1.1547)));
    camera.up.set(portrait?-1:0,portrait?0:1,0);
    bcam.set(0,BY,BZ+d);camera.position.lerp(bcam,Math.min(1,10*dt));camera.lookAt(bt);
  }
  syncPeers(dt);
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
tick();
})();
