<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>教室</title>
<style>
:root{--fg:#17202b;--panel:rgba(255,255,255,.88);--btn:rgba(255,255,255,.55);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fg:#e4e9f0;--panel:rgba(18,24,32,.88);--btn:rgba(18,24,32,.55)}}
:root[data-theme="dark"]{--fg:#e4e9f0;--panel:rgba(18,24,32,.88);--btn:rgba(18,24,32,.55)}
html,body{height:100%;margin:0;background:#222;color:var(--fg);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
.box{position:fixed;background:var(--panel);border-radius:8px;padding:8px 12px;font-size:14px}
.box button{font-size:14px;margin-left:8px;padding:4px 10px;border-radius:6px;border:1px solid var(--fg);background:transparent;color:var(--fg)}
#held{left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);display:none}
#bar{right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);display:none}
#toast{left:50%;top:calc(env(safe-area-inset-top,0px) + 60px);transform:translateX(-50%);opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#hint{left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);line-height:1.7}
#joy,#btns{display:none;position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);touch-action:none}
#joy{left:24px;width:130px;height:130px;border-radius:50%;background:var(--btn);border:2px solid var(--fg)}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--fg);opacity:.6}
#btns{right:24px}
#btns button{display:block;width:80px;height:80px;border-radius:50%;border:2px solid var(--fg);background:var(--btn);color:var(--fg);font-size:17px;touch-action:none}
.touch #joy,.touch #btns{display:block}
.touch #hint{display:none}
.bmode #joy,.bmode #btns,.bmode #hint,.bmode #held,.bmode #who{display:none!important}
.bmode #bar{display:block}
#cbtn{left:12px;top:calc(env(safe-area-inset-top,0px) + 64px);border:1px solid var(--fg);color:var(--fg);font-family:inherit;cursor:pointer}
#cpanel{left:12px;top:calc(env(safe-area-inset-top,0px) + 108px);display:none;max-width:250px}
#cpanel .row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
#cpanel .ttl{font-size:13px;opacity:.75}
#cpanel button{margin:0}
#cpanel .sh.on{background:var(--fg);color:var(--panel)}
#cpanel .sw{width:30px;height:30px;border-radius:50%;padding:0;border:2px solid transparent}
#cpanel .sw.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--panel) inset}

.bmode #cbtn,.bmode #cpanel{display:none!important}
#who{cursor:pointer}
.dcard{width:min(340px,100%);box-sizing:border-box;background:var(--panel);color:var(--fg);border-radius:14px;padding:20px 18px;box-shadow:0 8px 30px rgba(0,0,0,.35);font-size:15px}
.dcard h2{margin:0 0 6px;font-size:20px}
.dcard p{margin:0 0 14px;line-height:1.5;opacity:.8}
.dcard .acts{display:flex;gap:8px;flex-wrap:wrap}
#nickdlg,#res{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,14,18,.6);padding:16px;box-sizing:border-box}
#nickdlg{z-index:60}
#res{z-index:40}
#nickdlg input{width:100%;box-sizing:border-box;font:inherit;font-size:18px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--fg);background:transparent;color:var(--fg);user-select:text;-webkit-user-select:text}
#nickerr{min-height:20px;margin:8px 0 10px;font-size:14px;color:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #nickerr{color:#ff8f78}}
:root[data-theme="dark"] #nickerr{color:#ff8f78}
.pbtn{min-height:44px;padding:0 16px;border-radius:10px;border:1.5px solid var(--fg);background:transparent;color:var(--fg);font:inherit;font-size:16px;cursor:pointer;touch-action:manipulation}
.pbtn.main{background:var(--fg);color:var(--panel)}
.pbtn:disabled{opacity:.35;cursor:default}
#tbl{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 100px);transform:translateX(-50%);display:none;min-width:220px;max-width:calc(100vw - 24px);box-sizing:border-box;text-align:center;background:var(--panel);border-radius:12px;padding:10px 14px;font-size:14px}
#tbl .ttl{font-size:13px;opacity:.75;margin-bottom:6px}
#tbl .hint{font-size:13px;opacity:.75;margin:0 0 10px}
.sl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 8px}
.chip{padding:4px 10px;border-radius:999px;border:1.5px solid var(--fg);font-size:14px;white-space:nowrap}
.chip.me{font-weight:700}
.chip.rd{background:var(--fg);color:var(--panel)}
.chip.em{opacity:.45;border-style:dashed}
.chip.turn{outline:3px solid #f2c230;outline-offset:1px}
.chip.out{opacity:.45;text-decoration:line-through}
#tbl .acts,#gp .act{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#gp{position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;box-sizing:border-box;padding:10px 8px calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--panel);border-radius:16px 16px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.25);font-size:14px}
#gp .top{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
#gp .mid{min-height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;margin:6px 0}
#gp .cap.my{font-weight:700;font-size:16px}
.row5{display:flex;padding-left:6px}
.cd{flex:none;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:6px;border:1px solid #8a9096;background:#fff;color:#1a1a1a;font-family:inherit;font-weight:700;padding:0;line-height:1.1;touch-action:manipulation}
.cd.red{color:#c62828}
.row5 .cd{margin-left:-6px}
#gp .hand{display:flex;justify-content:center;padding-top:16px}
#gp button.cd{cursor:pointer;transition:transform .1s}
#gp button.cd.sel{transform:translateY(-14px);box-shadow:0 0 0 3px #f2c230}
#res .row{display:flex;justify-content:space-between;gap:16px;padding:7px 0;border-bottom:1px solid rgba(128,128,128,.3)}
#res .row.win{font-weight:700}
#res .acts{margin-top:14px}
.gmode #joy,.gmode #btns,.gmode #hint,.gmode #cbtn,.gmode #cpanel,.gmode #held{display:none!important}
#wbox{left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);display:none;gap:8px;padding:6px;z-index:15}
#wbox.on{display:flex}
#wbox button{min-height:44px;margin:0;padding:0 14px;font-size:15px}
.touch #wbox{bottom:calc(env(safe-area-inset-bottom,0px) + 180px)}
#btns #bj{margin-bottom:12px}
.bmode #wbox,.gmode #wbox{display:none!important}
@media (max-width:480px){.pbtn{padding:0 10px;font-size:15px}#gp .mid{min-height:76px}}
#here{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:80;display:none;min-width:96px;min-height:64px;padding:0 20px;border-radius:14px;border:3px solid var(--fg);background:var(--panel);color:var(--fg);font:inherit;font-size:32px;font-weight:700;touch-action:manipulation;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#here.wait{opacity:.8;font-size:16px;font-weight:600;min-height:52px;cursor:default}
#here.go{background:#f2c230;color:#17202b;border-color:#17202b;animation:hereblink .4s infinite alternate}
@keyframes hereblink{from{transform:scale(1)}to{transform:scale(1.12)}}
.rollon #held{top:calc(env(safe-area-inset-top,0px) + 80px)}
.rollon #cbtn{top:calc(env(safe-area-inset-top,0px) + 132px)}
.rollon #cpanel{top:calc(env(safe-area-inset-top,0px) + 176px)}
#cls{right:12px;top:calc(env(safe-area-inset-top,0px) + 104px);display:none;font-size:13px;padding:5px 10px;pointer-events:none;white-space:nowrap}
.bmode #cls{display:none!important}
#att{left:50%;top:calc(env(safe-area-inset-top,0px) + 104px);transform:translateX(-50%);display:none;z-index:30;text-align:center;white-space:pre-line;max-width:calc(100vw - 24px);box-sizing:border-box;line-height:1.6;pointer-events:none}
/* 校園 UI：柔和的紙張色、細邊框與一致的按鈕觸感 */
:root{--panel:rgba(250,248,241,.93);--btn:rgba(250,248,241,.72);--fg:#273746}
:root[data-theme="dark"]{--panel:rgba(28,37,46,.94);--btn:rgba(28,37,46,.78);--fg:#e7edf2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:rgba(28,37,46,.94);--btn:rgba(28,37,46,.78);--fg:#e7edf2}}
.box{border:1px solid rgba(76,91,101,.16);border-radius:14px;box-shadow:0 6px 20px rgba(36,49,58,.14);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.box button,.pbtn{transition:transform .16s ease,box-shadow .16s ease,background-color .16s ease}
.box button:hover,.pbtn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(30,45,55,.15)}
.box button:active,.pbtn:active{transform:translateY(1px) scale(.98)}
#hint{line-height:1.85;font-size:13px;padding:10px 15px}
#who{font-weight:700;letter-spacing:.02em}
#toast{font-weight:600;box-shadow:0 8px 24px rgba(36,49,58,.2)}
#cpanel,#tbl{box-shadow:0 12px 32px rgba(36,49,58,.2)}
#cbtn{font-weight:700}
@media(max-width:600px){#hint{font-size:12px}.box{border-radius:12px}#who{font-size:13px}}
#blk{position:fixed;inset:0;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;text-align:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .5s;z-index:60}
#blk.on{opacity:1;pointer-events:auto}
#pbox{left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);display:none;padding:6px;z-index:15}
.touch #pbox{bottom:calc(env(safe-area-inset-bottom,0px) + 180px)}
.bmode #pbox,.gmode #pbox{display:none!important}

/* 鏡子視窗（抽獎＋衣櫃） */
#toast{z-index:50}
#gwin{position:fixed;inset:0;display:none;z-index:40;color:#fff;pointer-events:none;font-size:15px}
#gwin.on{display:block}
#gwin button{font-family:inherit}
#gsky{position:absolute;inset:0;width:100%;height:100%;display:none;pointer-events:auto;touch-action:none;background:radial-gradient(ellipse at 50% 30%,#1b2460 0%,#0a0f2c 55%,#04061a 100%)}
#gwin.sky #gsky{display:block}
#gtop{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 8px;pointer-events:none}
#gtop>*,#gtabs>*{pointer-events:auto}
.gpill{background:rgba(10,14,40,.72);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 14px;font-weight:700}
.gb{border:1px solid rgba(255,255,255,.45);background:rgba(20,26,60,.78);color:#fff;border-radius:10px;padding:8px 14px;font-size:15px;cursor:pointer;touch-action:manipulation}
.gb.on{background:#fff;color:#14183a}
.gb.main{background:linear-gradient(#ffd54a,#e3a416);color:#2a1d00;border-color:#ffe9a0;font-weight:700}
.gb:disabled{opacity:.4;cursor:default}
#gtabs{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 56px);display:flex;justify-content:center;gap:8px;pointer-events:none}
#gmain{position:absolute;left:0;right:0;bottom:0;max-height:56vh;overflow-y:auto;padding:12px 14px calc(env(safe-area-inset-bottom,0px) + 16px);background:rgba(10,14,40,.9);border-radius:18px 18px 0 0;pointer-events:auto;box-sizing:border-box;-webkit-overflow-scrolling:touch}
#gwin.sky #gmain{top:calc(env(safe-area-inset-top,0px) + 100px);max-height:none;background:transparent;border-radius:0;max-width:560px;margin:0 auto}
#gbasic .row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
#gbasic .ttl{font-size:13px;opacity:.8}
#gbasic button{margin:0;border:1px solid rgba(255,255,255,.45);background:rgba(20,26,60,.78);color:#fff;border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer}
#gbasic .sh.on{background:#fff;color:#14183a}
#gbasic .sw{width:34px;height:34px;border-radius:50%;padding:0;border:2px solid transparent}
#gbasic .sw.on{border-color:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.55) inset}
.gspread{display:flex;justify-content:center;gap:10px;margin-bottom:10px;padding-top:12px}
.tc{width:92px;height:132px;border-radius:12px;border:2px solid #c9a94a;background:linear-gradient(160deg,#2a1f5a,#141040);color:#f6e7b0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;transition:transform .18s,box-shadow .18s;padding:4px;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.tc.sel{transform:translateY(-8px) scale(1.05);box-shadow:0 0 18px #ffd54a}
.tn{font-size:13px;opacity:.8}.te{font-size:32px}.tl{font-size:16px;font-weight:700}.ts{font-size:9px;letter-spacing:.12em;opacity:.7}
.ginfo{text-align:center;margin:6px 0}
.gt1{font-weight:700;font-size:16px;margin-bottom:6px}
.gbar{height:8px;border-radius:5px;background:rgba(255,255,255,.18);overflow:hidden;margin:4px auto 6px;max-width:320px}
.gfill{height:100%;background:linear-gradient(90deg,#9fb4ff,#ffd54a)}
.gsm{font-size:12.5px;opacity:.85;line-height:1.6;margin:2px 0}
.gsm2{font-size:12.5px;opacity:.75;text-align:center;margin-bottom:6px}
.gnote{font-size:13px;text-align:center;margin:8px 0;color:#ffd9a0;line-height:1.5}
.gpay,.gacts,.gsubs{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.gcol{margin-top:10px}
.gchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.gchip{border:1px solid;border-radius:999px;padding:3px 10px;font-size:12.5px;background:rgba(255,255,255,.08)}
.gchip.no{opacity:.35}
#grit{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:calc(env(safe-area-inset-top,0px) + 100px) 12px calc(env(safe-area-inset-bottom,0px) + 18px);box-sizing:border-box;text-align:center}
#grit>*{pointer-events:auto}
.gcap{font-size:17px;font-weight:700;margin-bottom:8px;text-shadow:0 2px 8px #000}
.gcards{display:grid;gap:8px;justify-content:center;margin:auto 0;perspective:900px}
.gcards.ten{grid-template-columns:repeat(5,62px)}
.gcards.one{grid-template-columns:150px}
.gcard{height:90px;cursor:pointer;position:relative}
.gcards.one .gcard{height:210px}
.gc-in{position:absolute;inset:0;transition:transform .6s;transform-style:preserve-3d}
.gcard.flip .gc-in{transform:rotateY(180deg)}
.gc-back,.gc-face{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid #c9a94a;box-sizing:border-box;padding:2px}
.gc-back{background:linear-gradient(160deg,#2a1f5a,#141040);color:#ffd54a;font-size:26px}
.gc-face{transform:rotateY(180deg);background:#f4f1e6;color:#222}
.gc-face.r1{background:linear-gradient(#efe3ff,#cdb2ff);border-color:#b98cff}
.gc-face.r2{background:linear-gradient(#fff4c2,#ffd54a);border-color:#ffb300;box-shadow:0 0 16px #ffd54a}
.gce{font-size:26px}.gcards.one .gce{font-size:64px}
.gcn{font-size:11px;font-weight:700}.gcards.one .gcn{font-size:17px}
.gcr{font-size:9px;opacity:.7}.gcards.one .gcr{font-size:12px}
.gcs{font-size:10px;font-weight:700;color:#b3261e;white-space:nowrap}.gcn{white-space:nowrap}.gcards.ten .gcs{font-size:9px}.gcards.ten .gcard{height:98px}.gcards.one .gcs{font-size:14px}
#gflash{position:absolute;inset:0;background:radial-gradient(circle,#fff,#ffd54a 60%,transparent);opacity:0;pointer-events:none;transition:opacity .5s}
#gflash.on{opacity:.85;transition:none}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px;margin-top:8px}
.gi{border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.gi.on{background:rgba(255,255,255,.28);box-shadow:0 0 0 2px #fff inset}
.gi.no{opacity:.4;cursor:default}
.gie{font-size:26px}.gin{font-size:12px}
.mmode #joy,.mmode #btns,.mmode #hint,.mmode #cbtn,.mmode #held,.mmode #who,.mmode #wbox,.mmode #pbox,.mmode #cls{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="held" class="box">手持：板擦<button id="drop">放下</button></div>
<div id="bar" class="box"><span id="toolname">粉筆</span><button id="swap">改用粉筆</button><button id="exit">離開黑板</button></div>
<div id="toast" class="box"></div>
<button id="here" type="button">到</button>
<div id="cls" class="box"></div>
<div id="att" class="box"></div>
<div id="who" class="box" title="點一下可以改暱稱" style="right:12px;top:calc(env(safe-area-inset-top,0px) + 12px)"></div>
<button id="cbtn" class="box">造型／抽獎</button>
<div id="gbasic" style="display:none"><div class="ttl">形狀</div><div class="row" id="shrow"></div><div class="ttl">顏色</div><div class="row" id="cwrow"></div></div>
<div id="hint" class="box">W A S D　移動　拖曳或方向鍵　轉動視角<br>E　互動　也可以直接點擊椅子、門、窗戶、黑板、板擦、時鐘、毯子（大老二）<br>空白鍵　跳躍　R　回到教室起點<br>馬桶：點擊或按 E 坐下，坐著按「大號」，起來後再互動就能沖水<br>點名時，叫到你的名字就按左上角「到」（或空白鍵）<br>造型／抽獎：左上「造型／抽獎」按鈕，或廁所洗手台上方的鏡子</div>
<div id="joy"><div id="knob"></div></div>
<div id="btns"><button id="bj">跳</button><button id="bi">互動</button></div>
<div id="wbox" class="box"><button id="wtog" class="pbtn" type="button">開窗</button><button id="wgo" class="pbtn main" type="button">翻出窗外</button></div>
<div id="blk"></div>
<div id="pbox" class="box"><button id="poo" class="pbtn main" type="button">大號</button></div>
<div id="nickdlg"><div class="dcard"><h2>進入教室</h2><p>暱稱最多 7 個字。註冊並登入帳號可以累積遊戲幣；訪客不能。</p><input id="nickin" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" enterkeyhint="next" aria-label="暱稱" placeholder="暱稱（也是你的帳號）"><input id="pwin" type="password" autocomplete="current-password" enterkeyhint="done" aria-label="密碼" placeholder="密碼（至少 6 個字，訪客不用填）" style="margin-top:8px"><div id="nickerr" role="alert"></div><div class="acts"><button id="loginbtn" class="pbtn main">登入</button><button id="regbtn" class="pbtn">註冊</button><button id="nickok" class="pbtn">訪客進入</button><button id="nickcancel" class="pbtn" style="display:none">取消</button></div></div></div>
<div id="gwin"></div>
<div id="tbl"></div>
<div id="gp"></div>
<div id="res"><div class="dcard" id="resc"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// 自己的連線層：用 WebSocket 取代 claude.ai 的 room 和 db
(function(){
var ws=null,myId=null,connected=false,myPresence={},peerMap={},cache=null,handlers=[],boardCbs=[],lastBoards=[],nick=null,tryNick=null,nickFn=null,authToken=null,authFn=null,btFn=null,lastBt=null,winFn=null,lastWin=null,tinfoFn=null,lastTinfo=null,tchFn=null,lastTch=null,qFn=null,qsFn=null,lastQs=null,rollFn=null,bellFn=null,srvVer='',btlFn=null,lastBtl=null,toiFn=null,lastToi=null,flushFn=null,janFn=null,lastJan=null;
var gFn=null,lastGcat=null,lastGinv=null;
function rebuild(){
  var a=[];

function actChair(c){

  var b=boards[i];

function interact(){
  if(mode==='mirror'){closeG();return;}
  if(mode==='board'){exitBoard();return;}
  if(seat){stand();return;}
  if(bseat>=0){leaveTable();return;}
  if(p.y-0.5>2){var bb=null,bdd=99;
    wins.forEach(function(w){var d=wd(w);if(d<3&&d-0.5<bdd){bdd=d-0.5;bb=function(){actWin(w);};}});
    chairs.forEach(function(ch){if(ch.y&&onFl(ch.y)){var d=dxz(ch.x,ch.z);if(d<2.2&&d<bdd){bdd=d;bb=function(){actChair(ch);};}}});
    if(bb)bb();else say('二樓這裡還沒有東西可以互動');return;}
  if(tseat>=0){standT();net.toi({a:'up'});return;}
  var best=null,bs=99;
  function c(s,f){if(s<bs){bs=s;best=f;}}
  wins.forEach(function(w){var d=wd(w);if(d<3.0)c(d-0.5,function(){actWin(w);});});
  if(outs()){doors.forEach(function(dr){var d=dxz(dr.x,dr.z);if(d<3.2)c(d,function(){actDoor(dr);});});if(best)best();else say('附近沒有可以互動的東西');return;}
  chairs.forEach(function(ch){var d=dxz(ch.x,ch.z);if(!ch.y&&d<2.2)c(d,function(){actChair(ch);});});
  toilets.forEach(function(t,i){var d=dxz(t.x,t.z);if(d<2.3)c(d,function(){actToilet(i);});});
  var dmir=dxz(-3.5,-16);if(dmir<3.4&&p.y-0.5<1.5)c(dmir,actMirror);
  doors.forEach(function(dr){var d=dxz(dr.x,dr.z);if(d<3.2)c(d,function(){actDoor(dr);});});
  if(!held)erasers.forEach(function(e,i){var b=boards[i],de=dxz(b.ex,b.ez);if(de<3.2&&p.z>b.z&&p.z<b.z+14)c(de,function(){actEraser(i);});});
  boards.forEach(function(b,i){var db=Math.hypot(Math.max(0,Math.abs(p.x)-4),p.z-b.z)+2;if(db<8&&p.z>b.z&&p.z<b.z+14)c(db,function(){actBoard(i);});});
  BCS.forEach(function(b,ti){var dk=Math.hypot(p.x-b.x,p.z-b.z);if(dk<3.0)c(dk,function(){actBlanket(ti);});});
  if(best)best();else say('附近沒有可以互動的東西');
}

var ray=new THREE.Raycaster(),v2=new THREE.Vector2();

function tap(x,y){
  if(mode!=='walk')return;
  aim(x,y);var h=ray.intersectObjects(pickables,false);if(!h.length)return;
  var u=h[0].object.userData;
  if(outs()&&u.kind!=='window'&&u.kind!=='door'){say('先回教室再操作');return;}
  if(u.kind==='window')toggleWin(u.ref);else if(u.kind==='chair')actChair(u.ref);else if(u.kind==='door')actDoor(u.ref);else if(u.kind==='clock')actClock();
  else if(u.kind==='toilet')actToilet(u.ref);else if(u.kind==='eraser')actEraser(u.ref);else if(u.kind==='board')actBoard(u.ref);else if(u.kind==='blanket')actBlanket(u.tb);else if(u.kind==='mirror')actMirror();
}

function strokeTo(a,b,tl,r){
  var B=boards[r==null?curR:r],bx=B.x,btex=B.t;tl=tl||tool;bx.lineCap='round';bx.lineJoin='round';

function syncPeers(dt){
  var count=0,seen={},me=null,list=room?room.peers():[],idx=seat?chairs.indexOf(seat):-1;
  list.forEach(function(q){if(q.isMe&&q.sameTab)me=q;});
  if(room&&nickOK){
    var st=Math.round(p.x*50)+'|'+Math.round(p.z*50)+'|'+Math.round(facing*20)+'|'+idx+'|'+look.h+look.c+'|'+Math.round(p.y*20);
    if(st!==lastSent&&performance.now()-sentAt>100){
      lastSent=st;sentAt=performance.now();
      room.presence({n:myName,x:Math.round(p.x*100)/100,z:Math.round(p.z*100)/100,f:Math.round(facing*100)/100,s:idx,h:look.h,c:look.c,y:Math.round((p.y-0.5)*100)/100}).catch(function(){});
    }
  }
  list.forEach(function(q){
    if(q.isMe||q.kind!=='viewer')return;
    count++;seen[q.peer]=1;
    var pr=q.presence||{};if(typeof pr.x!=='number'||typeof pr.z!=='number')return;
    if(seat&&me&&pr.s===idx&&q.peer<me.peer){stand();say('這個位子被別人先坐了');}
    var nm=typeof pr.n==='string'?pr.n.slice(0,12):'玩家',o=others[q.peer];
    if(!o)o=others[q.peer]=makeOther(q.peer,nm);
    var oh=(typeof pr.h==='number'&&pr.h===Math.floor(pr.h)&&pr.h>=0&&pr.h<SHAPES.length)?pr.h:0;
    var oc=(typeof pr.c==='string'&&/^#[0-9a-f]{6}$/i.test(pr.c))?pr.c:'#'+new THREE.Color().setHSL(hue(q.peer)/360,0.65,0.55).getHexString();
    o.h=oh;o.c=oc;dress(o,oh,oc,pr.e);
    if(o.name!==nm){o.sp.material.map=labelTex(nm);o.sp.material.needsUpdate=true;o.name=nm;}
    var tx=pr.x,tz=pr.z,ty=(typeof pr.y==='number'?pr.y:groundAt(pr.x,pr.z,0))+0.5,sc=1,tf=typeof pr.f==='number'?pr.f:0;
    if(typeof pr.s==='number'&&pr.s>=0&&chairs[pr.s]){tx=chairs[pr.s].x;tz=chairs[pr.s].z;ty=0.78+(chairs[pr.s].y||0);sc=0.6;tf=Math.PI;}
    else if(typeof pr.q==='number'&&pr.q>=0&&pr.q<3&&toilets[pr.q]){tx=toilets[pr.q].x;tz=toilets[pr.q].z+0.1;ty=0.7;sc=0.6;tf=0;}
    else if(typeof pr.g==='number'&&pr.g>=0&&pr.g<12){var bq=BSEATS[pr.g>>2][pr.g&3];tx=bq.x;tz=bq.z;ty=0.33;sc=0.6;tf=bq.f;}
    if(!o.init){o.g.position.set(tx,ty,tz);o.init=true;}
    var k=Math.min(1,10*dt),gp=o.g.position;
    gp.x+=(tx-gp.x)*k;gp.y+=(ty-gp.y)*k;gp.z+=(tz-gp.z)*k;
    o.m.scale.setScalar(sc);
    o.m.rotation.y+=Math.atan2(Math.sin(tf-o.m.rotation.y),Math.cos(tf-o.m.rotation.y))*k;
    o.sp.position.y=SHAPES[o.h].top*sc+(sc===1?0.45:0.42);
    updOtherPet(o,pr,dt);
  });
  Object.keys(others).forEach(function(k){if(!seen[k]){var ov=others[k];killPet(ov.pet);if(ov.acc)disposeGroup(ov.acc);scene.remove(ov.g);delete others[k];}});
  var ct=(typeof myCoins==='number')?'　🪙 '+myCoins+((typeof GIN!=='undefined'&&GIN.ok)?'　⭐ '+(GIN.stars|0):''):'';
  var t=room?myName+ct+'　線上 '+(count+1)+' 人':myName+ct+'　單人模式';
  if(t!==whoTxt){whoTxt=t;whoEl.textContent=t;}
}

  else if(id==='skin_cow')t=cvTex(256,256,function(x,w,h){x.fillStyle='#f7f7f2';x.fillRect(0,0,w,h);x.fillStyle='#222';for(var i=0;i<9;i++){x.beginPath();x.ellipse(R()*w,R()*h,18+R()*26,12+R()*20,R()*3,0,6.3);x.fill();}});
  else if(id==='skin_melon')t=cvTex(256,256,function(x,w,h){for(var i=0;i<8;i++){x.fillStyle=i%2?'#2e7d32':'#7bc86c';x.fillRect(i*w/8,0,w/8+1,h);}});

function applySkin(m,id,col){

var skyX=gsky.getContext('2d'),bgStars=[],skyRaf=0;

function star5(x,y,R,col,a){
  skyX.save();skyX.translate(x,y);skyX.globalAlpha=a==null?1:a;skyX.fillStyle=col;skyX.shadowColor=col;skyX.shadowBlur=R*1.6;
  skyX.beginPath();for(var i=0;i<10;i++){var rr=i%2?R*0.42:R,an=-Math.PI/2+i*Math.PI/5;skyX.lineTo(Math.cos(an)*rr,Math.sin(an)*rr);}skyX.closePath();skyX.fill();skyX.restore();
}
function skyLoop(ts){
  skyRaf=requestAnimationFrame(skyLoop);
  var W=window.innerWidth,H=window.innerHeight,t=ts/1000;
  skyX.clearRect(0,0,W,H);
  bgStars.forEach(function(s){skyX.globalAlpha=0.25+0.6*(0.5+0.5*Math.sin(t*s.sp+s.ph));skyX.fillStyle='#fff';skyX.beginPath();skyX.arc(s.x*W,s.y*H,s.r,0,6.283);skyX.fill();});
  skyX.globalAlpha=1;

  var pts=rit.pts,col=rit.col||'#cfe0ff';
  skyX.lineWidth=2.5;skyX.strokeStyle=col;skyX.shadowColor=col;skyX.shadowBlur=10;
  for(var i=1;i<rit.k&&i<pts.length;i++){skyX.beginPath();skyX.moveTo(pts[i-1].x,pts[i-1].y);skyX.lineTo(pts[i].x,pts[i].y);skyX.stroke();}
  if(rit.drag&&rit.k>0&&rit.k<pts.length&&rit.px!=null){skyX.globalAlpha=0.5;skyX.beginPath();skyX.moveTo(pts[rit.k-1].x,pts[rit.k-1].y);skyX.lineTo(rit.px,rit.py);skyX.stroke();skyX.globalAlpha=1;}
  skyX.shadowBlur=0;
  pts.forEach(function(q,j){
    var lit=j<rit.k,next=j===rit.k;
    if(lit)star5(q.x,q.y,15+(rit.done?4*Math.sin(t*6):0),rit.done?col:'#fff6c8',1);
    else{
      star5(q.x,q.y,10,'#9fb4ff',next?0.95:0.45);
      if(next){skyX.strokeStyle='rgba(255,236,170,'+(0.5+0.4*Math.sin(t*6))+')';skyX.lineWidth=2;skyX.beginPath();skyX.arc(q.x,q.y,22+3*Math.sin(t*6),0,6.283);skyX.stroke();}
    }
  });
}

  x.beginPath();x.moveTo(l+r,5);x.arcTo(l+w,5,l+w,65,r);x.arcTo(l+w,65,l,65,r);x.arcTo(l,65,l,5,r);x.arcTo(l,5,l+w,5,r);x.closePath();x.fill();x.stroke();
  x.beginPath();x.moveTo(244,64);x.lineTo(256,90);x.lineTo(268,64);x.closePath();x.fill();
  x.fillStyle='#17202b';x.textAlign='center';x.textBaseline='middle';x.fillText(t,256,36);
  return new THREE.CanvasTexture(c);
}
function makeTeacher(info){
  var g=new THREE.Group();scene.add(g);
  var s=SHAPES[3],col=/^#[0-9a-f]{6}$/i.test(info.c)?info.c:'#888888';
  var m=new THREE.Mesh(s.g(),mat(new THREE.Color(col).getHex(),{roughness:.5}));m.castShadow=true;g.add(m);
  var f=new THREE.Mesh(new THREE.BoxGeometry(s.fw,0.18,0.05),mat(0x1c1c1c));f.position.set(0,s.fy,s.fz);m.add(f);
  box(0.95,0.07,0.95,0x20252c,0,0.94,0,m);box(0.5,0.1,0.5,0x20252c,0,0.87,0,m);box(0.12,0.4,0.04,0xc0392b,0,0.1,0.36,m); // 方帽與領帶，一眼認得出老師
  var nm=String(info.n||'老師').slice(0,6)+'・'+String(info.s||'').slice(0,3);
  var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:labelTex(nm),depthTest:false}));sp.scale.set(1.8,0.45,1);sp.position.set(0,1.5,0);sp.renderOrder=5;g.add(sp);
  var bub=new THREE.Sprite(new THREE.SpriteMaterial({depthTest:false,transparent:true}));bub.scale.set(3.2,0.6,1);bub.position.set(0,2.15,0);bub.renderOrder=6;bub.visible=false;g.add(bub);
  return {g:g,m:m,bub:bub,say:'',bt:'',init:false,st:0};
}
function updTeachers(dt){
  var tm=performance.now()/1000;
  teachers.forEach(function(t){
    if(typeof t.tx!=='number')return;
    if(!t.init){t.px=t.tx;t.pz=t.tz;t.pf=t.tf;t.py=groundAt(t.tx,t.tz,0);t.init=true;}
    var k=Math.min(1,8*dt);t.px+=(t.tx-t.px)*k;t.pz+=(t.tz-t.pz)*k;
    t.pf+=Math.atan2(Math.sin(t.tf-t.pf),Math.cos(t.tf-t.pf))*Math.min(1,10*dt);
    t.py+=(groundAt(t.px,t.pz,0)-t.py)*Math.min(1,14*dt);
    var bob=t.st===1?Math.abs(Math.sin(tm*9))*0.09:(t.st===2?Math.abs(Math.sin(tm*12))*0.05:0);
    t.g.position.set(t.px,t.py+0.5+bob,t.pz);t.m.rotation.y=t.pf;
    if(t.bt!==t.say){
      t.bt=t.say;if(t.bub.material.map)t.bub.material.map.dispose();
      if(t.say){t.bub.material.map=bubTex(t.say);t.bub.material.needsUpdate=true;}
      t.bub.visible=!!t.say;
    }
  });
  // 老師經過門口時，門自動開（只是畫面效果，不影響你自己開關門）
  doors.forEach(function(d){
    var o=false;
    for(var i=0;i<teachers.length;i++){var t=teachers[i];if(t.init&&Math.abs(t.px-d.x)<1.3&&Math.abs(t.pz-d.z)<1.2){o=true;break;}}
    if(!o&&jan&&jan.init&&jan.py<2&&Math.abs(jan.px-d.x)<1.3&&Math.abs(jan.pz-d.z)<1.2)o=true;d.tOpen=o;
  });
}
net.onTinfo(function(m){
  if(teachers.length)return;
  (m.ts||[]).forEach(function(inf){teachers.push(makeTeacher(inf));});
});
net.onTch(function(m){
  if(typeof m.now!=='number')return;
  srvOff=m.now-Date.now();synced=true;
  (m.ts||[]).forEach(function(u,i){
    var t=teachers[i];if(!t||!u||typeof u.x!=='number'||typeof u.z!=='number')return;
    t.tx=u.x;t.tz=u.z;t.tf=typeof u.f==='number'?u.f:0;t.st=u.s|0;t.say=typeof u.b==='string'?u.b.slice(0,20):'';
  });
});
// 清潔工（伺服器控制）與馬桶狀態
var jan=null;
function makeJan(){
  var g=new THREE.Group();scene.add(g);var s=SHAPES[3];
  var m=new THREE.Mesh(s.g(),mat(0x6b8f71,{roughness:.5}));m.castShadow=true;g.add(m);

  box(0.74,0.5,0.74,0xf2c230,0,-0.05,0,m);box(0.8,0.1,0.8,0xf2c230,0,0.93,0,m);
  cylinder(0.03,0.03,1.5,0x8a5a3b,0.55,0.25,0.2,m);box(0.4,0.1,0.25,0xdadada,0.55,-0.5,0.2,m);
  var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:labelTex('清潔工'),depthTest:false}));sp.scale.set(1.8,0.45,1);sp.position.set(0,1.5,0);sp.renderOrder=5;g.add(sp);
  var bub=new THREE.Sprite(new THREE.SpriteMaterial({depthTest:false,transparent:true}));bub.scale.set(3.2,0.6,1);bub.position.set(0,2.15,0);bub.renderOrder=6;bub.visible=false;g.add(bub);
  return {g:g,m:m,bub:bub,say:'',bt:'',init:false,st:0};
}
function updJan(dt){
  var t=jan;if(!t||typeof t.tx!=='number')return;
  if(!t.init){t.px=t.tx;t.pz=t.tz;t.py=t.ty;t.pf=t.tf;t.init=true;}
  var k=Math.min(1,8*dt);t.px+=(t.tx-t.px)*k;t.pz+=(t.tz-t.pz)*k;t.py+=(t.ty-t.py)*k;
  t.pf+=Math.atan2(Math.sin(t.tf-t.pf),Math.cos(t.tf-t.pf))*Math.min(1,10*dt);
  t.g.position.set(t.px,0.5+t.py+(t.st===1?Math.abs(Math.sin(performance.now()/1000*12))*0.1:0),t.pz);t.m.rotation.y=t.pf;
  if(t.bt!==t.say){t.bt=t.say;if(t.bub.material.map)t.bub.material.map.dispose();if(t.say){t.bub.material.map=bubTex(t.say);t.bub.material.needsUpdate=true;}t.bub.visible=!!t.say;}
}
net.onJan(function(m){
  if(!jan)jan=makeJan();
  jan.tx=m.x;jan.tz=m.z;jan.ty=m.y||0;jan.tf=typeof m.f==='number'?m.f:0;jan.st=m.s|0;jan.say=typeof m.b==='string'?m.b.slice(0,24):'';
});
net.onToi(function(m){
  if(m.err){say(m.err);return;}
  TS=m.s||TS;toilets.forEach(function(t,i){t.poop.visible=!!(TS[i]&&TS[i].p);});
  var me=net.id();
  TS.forEach(function(q,i){if(q.o&&q.o===me&&tseat<0&&performance.now()-tUp>800)sitT(i);});
  if(tseat>=0&&(!TS[tseat]||TS[tseat].o!==me))standT();
  updPbox();
});
net.onFlush(function(m){
  var t=toilets[m.i];if(!t)return;var d=dxz(t.x,t.z);
  if(d<14)beep([420,360,300,240,200],0.13,'sawtooth');
  if(d<3)say('嘩啦～沖水了');
});
// 黑板題目：伺服器只傳題目文字，每個人的畫面自己把字寫在黑板上
function wrapLines(x,t,maxW){
  var out=[],cur='';
  Array.from(t).forEach(function(ch){if(cur&&x.measureText(cur+ch).width>maxW){out.push(cur);cur=ch;}else cur+=ch;});
  if(cur)out.push(cur);return out;
}
function drawQ(r,q){
  var B=boards[r];if(!B)return;var x=B.x;
  x.fillStyle=BG;x.fillRect(0,0,BW,BHc);x.textBaseline='top';x.textAlign='left';
  x.fillStyle='#f2e6a0';x.font='bold 40px sans-serif';
  x.fillText('第 '+q.p+' 節　'+q.subj+'　'+q.teacher+'　第 '+q.k+' 題',70,34);
  x.fillStyle='#fff';x.font='bold 60px sans-serif';
  wrapLines(x,String(q.text||''),BW-140).slice(0,4).forEach(function(l,i){x.fillText(l,70,108+i*80);});
  B.t.needsUpdate=true;
}
function myRoom(){
  if(p.x<-8||p.x>8||p.y>2.6)return -1;
  return p.z>=-7&&p.z<7?0:(p.z>=7&&p.z<21?1:(p.z>=21&&p.z<=35?2:-1));
}
net.onQ(function(q){
  if(!q||!(q.r>=0&&q.r<=2))return;
  qCur[q.r]=q;drawQ(q.r,q);
  if(dirty&&dirtyR===q.r)dirty=false;
  if(myRoom()===q.r)say('黑板換了新題目（'+q.subj+'）');
});
net.onQs(function(qs){
  (qs||[]).forEach(function(q,i){
    if(!q)return;qCur[i]=q;
    if(snapQ[i]===q.id)return; // 伺服器給的黑板快照已經包含這一題
    drawQ(i,q);
  });
});
// 點名：只有被叫到名字的那幾秒按「到」才算
var hereB=document.getElementById('here'),attB=document.getElementById('att'),rollSt='off',rollT=0,attT=0;
function setRoll(st,txt){
  rollSt=st;hereB.style.display=st==='off'?'none':'block';hereB.className=st==='go'?'go':'wait';
  if(txt!=null)hereB.textContent=txt;
  document.body.classList.toggle('rollon',st!=='off');
}
function pressHere(){
  if(rollSt==='off'||hereB.textContent==='已到')return;
  net.here();
}
hereB.addEventListener('pointerdown',function(e){e.preventDefault();pressHere();});
function showAtt(m){
  var names=m.p||[],s=names.join('、');if(s.length>60)s=s.slice(0,58)+'…';
  attB.textContent='點名結束　出席 '+names.length+' / '+m.k+' 人'+(s?'\n'+s:'')+(m.me?'':'\n（你這次記缺席）');
  attB.style.display='block';clearTimeout(attT);attT=setTimeout(function(){attB.style.display='none';},9000);
}
var kickLock=0,blkEl=document.getElementById('blk');
function kickOut(rm){
  kickLock=performance.now()+2000;
  blkEl.textContent='你沒有回應點名，被請出教室了';blkEl.className='on';
  setTimeout(function(){
    if(mode==='board')exitBoard();
    if(mode==='mirror')closeG();
    if(seat)stand();if(bseat>=0)leaveTable();if(tseat>=0){standT();net.toi({a:'up'});}
    vault=null;air=false;vy=0;player.scale.setScalar(1);
    p.set(-9.5,0.5,[-4,10,24][rm]||-4);facing=Math.PI/2;player.rotation.y=facing;yaw=-Math.PI/2;pitch=0.45;
  },650);
  setTimeout(function(){blkEl.className='';say('可以再走回教室');},1900);
}
net.onRoll(function(m){
  if(m.a==='kick'){kickOut(m.r|0);return;}
  if(m.a==='start'){if(mode==='mirror')closeG();setRoll('wait','等叫到你');say('點名開始，叫到你的名字時按「到」');beep([660],0.18);}
  else if(m.a==='call'){
    setRoll('go','到');beep([988,1319],0.12);
    try{if(navigator.vibrate)navigator.vibrate([60,40,60]);}catch(e){}
    clearTimeout(rollT);rollT=setTimeout(function(){if(rollSt==='go'){setRoll('wait','來不及了');say('沒趕上，這次記缺席');}},(m.ms||3000)+800);
  }
  else if(m.a==='ok'){clearTimeout(rollT);setRoll('wait','已到');say('已回應「到」');}
  else if(m.a==='early'){say('還沒叫到你，等老師叫你的名字');}
  else if(m.a==='late'){clearTimeout(rollT);setRoll('wait','來不及了');say('來不及了，這次記缺席');}
  else if(m.a==='end'){clearTimeout(rollT);setRoll('off');showAtt(m);}
});
net.onBell(function(m){
  if(m.k==='start'){beep([784,659,784,659],0.28,'triangle');say('上課鐘響　第 '+(m.n%9+1)+' 節開始');}
  else{beep([523,659,784,1047],0.28,'triangle');say('下課鐘響');}
});

var clk=new THREE.Clock(),bcam=new THREE.Vector3(),bt=new THREE.Vector3(0,BY,BZ+0.07);
function tick(){
  var dt=Math.min(clk.getDelta(),0.05);
  var ck=Math.floor(srvNow()/250);if(ck!==lastSec){lastSec=ck;drawClock(gameDate());updHud();}
  if(rollSt!=='off'&&!net.online())setRoll('off');
  updTeachers(dt);updJan(dt);updCat();updPets(dt);tickLooks(performance.now()/1000);
  doors.forEach(function(d){d.piv.rotation.y+=(((d.open||d.tOpen)?-Math.PI/2:0)-d.piv.rotation.y)*Math.min(1,6*dt);});
  wins.forEach(function(w){w.piv.rotation.y+=((w.open?Math.PI/2:0)-w.piv.rotation.y)*Math.min(1,6*dt);});
  updWbox();
  if(mode==='walk'){
    if(keys.ArrowLeft)yaw+=1.8*dt;if(keys.ArrowRight)yaw-=1.8*dt;
    if(keys.ArrowUp)pitch=Math.min(1.4,pitch+1.2*dt);if(keys.ArrowDown)pitch=Math.max(0.05,pitch-1.2*dt);
    var f=(keys.KeyW?1:0)-(keys.KeyS?1:0)-joy.y,r=(keys.KeyD?1:0)-(keys.KeyA?1:0)+joy.x,m=Math.hypot(f,r);
    if(m>1){f/=m;r/=m;m=1;}
    if(performance.now()<kickLock){f=0;r=0;m=0;}
    if(seat||bseat>=0||tseat>=0){if(m>0.5){if(seat)stand();else if(bseat>=0)leaveTable();else{standT();net.toi({a:'up'});}}}
    else if(vault){
      vault.t+=dt/0.7;var vu=Math.min(1,vault.t),ve=vu*vu*(3-2*vu);
      p.x=vault.x0+(vault.x1-vault.x0)*ve;p.z=vault.z0+(vault.z1-vault.z0)*ve;p.y=0.5+vault.y0+1.05*Math.sin(Math.PI*vu);
      facing=(vault.x1>vault.x0?1:-1)*Math.PI/2;player.rotation.y=facing;
      if(vu>=1){var voy=vault.y0;vault=null;p.y=0.5+voy;air=false;vy=0;}
    }
    else{
      if(m>0.08){
        var dx=-Math.sin(yaw)*f+Math.cos(yaw)*r,dz=-Math.cos(yaw)*f-Math.sin(yaw)*r;
        tryMove(p.x+dx*4.5*dt,p.z+dz*4.5*dt);
        var tg=Math.atan2(dx,dz),df=Math.atan2(Math.sin(tg-facing),Math.cos(tg-facing));
        facing+=df*Math.min(1,12*dt);player.rotation.y=facing;
      }
      var feet=p.y-0.5,gy=groundAt(p.x,p.z);
      if((keys.Space||jumpReq)&&!air){vy=6.2;air=true;}
      jumpReq=false;
      if(!air&&feet>gy+0.08){air=true;vy=0;}
      if(air){vy-=18*dt;feet+=vy*dt;if(vy<=0&&feet<=gy){feet=gy;air=false;vy=0;}}
      else feet+=(gy-feet)*Math.min(1,14*dt);
      p.y=feet+0.5;
      if(feet<-4){say('掉出地圖了，回到教室');reset();}
    }
    camera.up.set(0,1,0);
    var cx=p.x+Math.sin(yaw)*Math.cos(pitch)*dist,cy=p.y+Math.sin(pitch)*dist,cz=p.z+Math.cos(yaw)*Math.cos(pitch)*dist;
    var rm=roomOf(p.x,p.z),flo=(p.y-0.5)>H-0.7?H:0;
    if(rm)camera.position.set(clamp(cx,rm[0]+.3,rm[1]-.3),clamp(cy,flo+0.4,flo+H-0.3),clamp(cz,rm[2]+.3,rm[3]-.3));
    else camera.position.set(clamp(cx,-70,70),clamp(cy,0.4,14),clamp(cz,-70,70));
    camera.lookAt(p.x,p.y,p.z);
  }else if(mode==='mirror'){
    camera.up.set(0,1,0);
    var mx=p.x+Math.sin(yaw)*Math.cos(pitch)*dist,my=p.y+Math.sin(pitch)*dist,mz=p.z+Math.cos(yaw)*Math.cos(pitch)*dist;
    var mrm=roomOf(p.x,p.z),mfl=(p.y-0.5)>H-0.7?H:0;
    if(mrm){mx=clamp(mx,mrm[0]+.3,mrm[1]-.3);my=clamp(my,mfl+0.4,mfl+H-0.3);mz=clamp(mz,mrm[2]+.3,mrm[3]-.3);}
    else{mx=clamp(mx,-70,70);my=clamp(my,0.4,14);mz=clamp(mz,-70,70);}
    bcam.set(mx,my,mz);camera.position.lerp(bcam,Math.min(1,8*dt));
    camera.lookAt(p.x,p.y-1.0,p.z); // 看向腳下一點，角色會出現在畫面上半部，不被下方面板擋住
  }else{
    var portrait=camera.aspect<1,d=portrait?7.4:Math.min(9,Math.max(2.4,8.5/(camera.aspect*1.1547)));
    camera.up.set(portrait?-1:0,portrait?0:1,0);
    bcam.set(0,BY,BZ+d);camera.position.lerp(bcam,Math.min(1,10*dt));camera.lookAt(bt);
  }
  var sl=Math.hypot(4,10,5),sfx=-4/sl,sfy=-10/sl,sfz=-5/sl,srl=Math.hypot(sfz,sfx),srx=-sfz/srl,srz=sfx/srl,sux=-srz*sfy,suy=srz*sfx-srx*sfz,suz=srx*sfy,sts=28/1024,sa=p.x*srx+p.z*srz,sb=p.x*sux+p.z*suz,sda=Math.round(sa/sts)*sts-sa,sdb=Math.round(sb/sts)*sts-sb,stx=p.x+sda*srx+sdb*sux,sty=sdb*suy,stz=p.z+sda*srz+sdb*suz;
  sun.position.set(stx+4,sty+10,stz+5);sun.target.position.set(stx,sty,stz);sun.target.updateMatrixWorld();
  syncPeers(dt);
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
tick();
})();
